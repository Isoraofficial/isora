<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Halaman Tidak Ditemukan — ISORA</title>
 <meta name="description" content="Halaman yang Anda cari tidak ditemukan.">
 <meta name="robots" content="noindex">
 <script src="/js/head.js"></script>
 <link rel="stylesheet" href="/css/style-content.css">
 <style>
  main{margin-top:0px;}
  .error-code {
   font-family: var(--font-display);
   font-size: 77px;
   font-weight: 700;
   letter-spacing: 4px;
   color: var(--accent);
   line-height: 1;
   margin: 20px 0 8px;}
  .text{color:var(--800);}
  .error-links {
   margin: 24px 0 8px;
   display: flex;
   flex-wrap: wrap;
   gap: 12px;}
  .error-links a {
   display: inline-block;
   padding: 10px 18px;
   border: 1px solid var(--300);
   border-radius: 6px;
   background:var(--50);
   color: var(--light);
   text-decoration: none;
   font-size: 12px;
   font-weight: 400;
   letter-spacing: 0.3px;
   transition: border-color 0.15s, color 0.15s;}
 </style>
</head>
<body>
 
<script src="/js/nav.js"></script>

<main>
 <div class="error-code">404</div>
 <h2 class="title-page">Halaman Tidak Ditemukan</h2>
 <p class="text">Halaman yang Anda cari tidak tersedia. Kemungkinan URL salah ketik, atau halaman telah dipindahkan.</p>
 <div class="error-links">
  <a href="/">Kembali ke Beranda</a>
 </div>
</main>
</body>
</html>
